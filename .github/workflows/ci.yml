name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bookit:bookit@localhost:5432/bookit?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookit
          POSTGRES_PASSWORD: bookit
          POSTGRES_DB: bookit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookit -d bookit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
